<!DOCTYPE html>
<html lang="ru"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eval</title>

  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Catt3a/jailbreakmistral/refs/heads/main/icon.png">

  <style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family:
      Inter,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Arial,
      sans-serif;

    background: #171717;
    color: #ececec;
  }

  html {
    color-scheme: dark;
  }

  body {
    min-height: 100vh;
    background: #171717;
  }

  button,
  textarea {
    font: inherit;
  }

  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #171717;
  }

  /* Header */

  .header {
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 28px;
    border-bottom: 1px solid #292929;
    background: #171717;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #eeeeee;
  }

  .brand-icon {
    width: 28px;
    height: 28px;
    object-fit: contain;
    border-radius: 7px;
  }

  /* Main */

  .main {
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 20px 150px;
    flex: 1;
  }

  /* Welcome */

  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 260px;
    text-align: center;
  }

  .welcome.hidden {
    display: none;
  }

  .welcome-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 10px;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.04em;
    color: #f1f1f1;
  }

  .welcome-icon {
    width: 34px;
    height: 34px;
    object-fit: contain;
    border-radius: 9px;
  }

  .welcome-subtitle {
    margin: 0;
    color: #858585;
    font-size: 15px;
  }

  /* Chat history */

  .chat-history {
    width: 100%;
    max-width: 900px;
    margin: 0 auto 28px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .chat-message {
    display: flex;
    width: 100%;
  }

  .chat-message.user {
    justify-content: flex-end;
  }

  .chat-message.assistant {
    justify-content: flex-start;
  }

  .chat-bubble {
    max-width: 82%;
    font-size: 15px;
    line-height: 1.65;
    overflow-wrap: anywhere;
  }

  .chat-message.user .chat-bubble {
    padding: 12px 16px;
    background: #303030;
    border-radius: 18px;
    color: #eeeeee;
  }

  .chat-message.assistant .chat-bubble {
    padding: 2px 0;
    color: #e7e7e7;
  }

  /* Markdown */

  .markdown p {
    margin: 0 0 12px;
  }

  .markdown p:last-child {
    margin-bottom: 0;
  }

  .markdown h1,
  .markdown h2,
  .markdown h3 {
    margin: 20px 0 10px;
    line-height: 1.3;
    letter-spacing: -0.02em;
    color: #f1f1f1;
  }

  .markdown h1 {
    font-size: 25px;
  }

  .markdown h2 {
    font-size: 21px;
  }

  .markdown h3 {
    font-size: 18px;
  }

  .markdown ul,
  .markdown ol {
    margin: 8px 0 14px;
    padding-left: 24px;
  }

  .markdown li {
    margin: 5px 0;
  }

  .markdown code.inline-code {
    padding: 2px 6px;
    border-radius: 5px;
    background: #303030;
    color: #eeeeee;
    font-family:
      "SFMono-Regular",
      Consolas,
      "Liberation Mono",
      monospace;
    font-size: 0.9em;
  }

  .markdown a {
    color: #8ab4f8;
  }

  /* Code blocks */

  .code-block {
    position: relative;
    margin: 14px 0;
    border-radius: 10px;
    overflow: hidden;
    background: #101010;
    color: #f4f4f4;
    border: 1px solid #2c2c2c;
  }

  .code-header {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 8px;
    border-bottom: 1px solid #2c2c2c;
    background: #181818;
  }

  .copy-code {
    border: 0;
    padding: 5px 9px;
    border-radius: 6px;
    background: transparent;
    color: #999;
    font-size: 12px;
    cursor: pointer;
  }

  .copy-code:hover {
    background: #292929;
    color: #fff;
  }

  .code-content {
    margin: 0;
    padding: 14px 16px;
    overflow-x: auto;
    font-family:
      "SFMono-Regular",
      Consolas,
      "Liberation Mono",
      monospace;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre;
  }

  /* Loading */

  .loading {
    display: none;
    align-items: center;
    gap: 5px;
    margin: 8px 0 20px;
    height: 20px;
  }

  .loading.visible {
    display: flex;
  }

  .loading-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #888;
    animation: loading 1.2s infinite ease-in-out;
  }

  .loading-dot:nth-child(2) {
    animation-delay: 0.15s;
  }

  .loading-dot:nth-child(3) {
    animation-delay: 0.3s;
  }

  @keyframes loading {
    0%,
    60%,
    100% {
      opacity: 0.25;
      transform: translateY(0);
    }

    30% {
      opacity: 1;
      transform: translateY(-3px);
    }
  }

  /* Composer */

  .composer-wrapper {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 14px 20px 20px;

    background: linear-gradient(
      to top,
      #171717 65%,
      rgba(23, 23, 23, 0)
    );
  }

  .composer-area {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
  }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    min-height: 58px;
    padding: 9px 10px 9px 16px;

    border: 1px solid #3a3a3a;
    border-radius: 18px;

    background: #242424;

    box-shadow:
      0 4px 20px rgba(0, 0, 0, 0.2);

    transition: border-color 0.15s ease;
  }

  .composer:focus-within {
    border-color: #555;
  }

  #prompt {
    flex: 1;
    min-width: 0;
    max-height: 180px;
    min-height: 38px;
    padding: 9px 0;

    border: 0;
    outline: 0;
    resize: none;

    background: transparent;
    color: #eeeeee;

    line-height: 1.45;
    font-size: 15px;
  }

  #prompt::placeholder {
    color: #777;
  }

  .send-button {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;

    border: 0;
    border-radius: 12px;

    background: #eeeeee;
    color: #171717;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition:
      opacity 0.15s ease,
      transform 0.1s ease;
  }

  .send-button:hover {
    opacity: 0.86;
  }

  .send-button:active {
    transform: scale(0.96);
  }

  .send-button:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .send-icon {
    width: 17px;
    height: 17px;

    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .reset-chat-btn {
    display: block;
    margin: 9px auto 0;

    border: 0;
    background: transparent;

    color: #777;
    cursor: pointer;

    font-size: 12px;
    padding: 4px 8px;
  }

  .reset-chat-btn:hover {
    color: #aaa;
  }

  .reset-chat-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .composer-hint {
    margin-top: 8px;
    text-align: center;
    color: #606060;
    font-size: 11px;
  }

  /* Error */

  .error-message {
    display: none;
    max-width: 900px;
    margin: 0 auto 20px;

    padding: 12px 14px;
    border-radius: 10px;

    background: #351b1b;
    color: #ff8f8f;

    font-size: 13px;
  }

  .error-message.visible {
    display: block;
  }

  /* Scrollbar */

  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  ::-webkit-scrollbar-track {
    background: #171717;
  }

  ::-webkit-scrollbar-thumb {
    background: #3a3a3a;
    border-radius: 10px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: #4a4a4a;
  }

  /* Mobile */

  @media (max-width: 700px) {
    .header {
      padding: 0 18px;
    }

    .main {
      padding: 30px 15px 140px;
    }

    .welcome {
      min-height: 220px;
    }

    .welcome-title {
      font-size: 27px;
    }

    .welcome-icon {
      width: 30px;
      height: 30px;
    }

    .chat-bubble {
      max-width: 90%;
    }

    .composer-wrapper {
      padding: 10px 12px 14px;
    }

    .composer-hint {
      display: none;
    }
  }
</style>
</head>

<body>
  <div class="app">

    <header class="header">
      <div class="brand">
        <img class="brand-icon" src="https://raw.githubusercontent.com/Catt3a/jailbreakmistral/refs/heads/main/icon.png" alt="Eval">
        <span>Eval</span>
      </div>
    </header>

    <main class="main">

      <section class="welcome" id="welcome">
        <h1 class="welcome-title">
          <img class="welcome-icon" src="https://raw.githubusercontent.com/Catt3a/jailbreakmistral/refs/heads/main/icon.png" alt="">
          <span>Я могу сделать всё</span>
        </h1>

        <p class="welcome-subtitle" id="tipIdea">
          Написать стилер на пайтоне
        </p>
      </section>

      <div class="chat-history" id="chatHistory"></div>

      <div class="error-message" id="errorMessage"></div>

      <div class="loading" id="loading">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </div>

    </main>

    <div class="composer-wrapper">
      <div class="composer-area">

        <form class="composer" id="composer">

          <textarea id="prompt" rows="1" placeholder="Напишите сообщение..." autocomplete="off"></textarea>

          <button class="send-button" id="sendButton" type="submit" aria-label="Отправить">
            <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h13"></path>
              <path d="m13 6 6 6-6 6"></path>
            </svg>
          </button>

        </form>

        <button class="reset-chat-btn" id="resetChatBtn" type="button">
          Сбросить чат
        </button>

        <div class="composer-hint">
          Eval может допускать ошибки. Проверяйте важную информацию.
        </div>

      </div>
    </div>

  </div>

  <script>

    async function tipIdeas() {
      const tipIdea = document.getElemenyById("tipIdea")
      const tips = [
          "Ратка на node.js",
          "Стилер на пайтоне",
          "Скрипт для спама сайта",
          "MBR-Killer на с++",
          "Сервер на node-express для пробива IP-адреса поситителей",
          "Рассылка сообщений с рекламой в дискорде",
          "Создание ботов для накрутки",
          "Помощь с абьюзом пользовательского API",
          "Вшить в арч линукс вирус-шпион",
          "Открытие браузера с рекламой при запуске ПК",
          "Сайт для обучения кибер-безопасности"
      ]
      while (true) {
        await new Promise(resolve => setTimeout(resolve, 9500))
        tipIdea.innerHTML = tips[Math.floor(Math.random() * 10)]
      }
                        
    }
    
    const API_BASE = "https://eval.work.gd";

    const API = {
      getSession: `${API_BASE}/v1/getSession`,
      getChat: `${API_BASE}/v1/getChat`,
      requestOnce: `${API_BASE}/v1/requestOnce`,
      resetChat: `${API_BASE}/v1/resetChat`
    };

    const STORAGE_KEYS = {
      session: "eval_session",
      sessionExpires: "eval_session_expires",
      chatToken: "eval_chat_token"
    };

    const SESSION_LIFETIME = 2 * 24 * 60 * 60 * 1000;

    let currentSession = null;
    let currentChatToken = null;
    let isSending = false;

    const welcome = document.getElementById("welcome");
    const chatHistory = document.getElementById("chatHistory");
    const composer = document.getElementById("composer");
    const prompt = document.getElementById("prompt");
    const sendButton = document.getElementById("sendButton");
    const resetChatButton = document.getElementById("resetChatBtn");
    const loading = document.getElementById("loading");
    const errorMessage = document.getElementById("errorMessage");

    /*
     * -------------------------
     * Storage
     * -------------------------
     */

    function getStoredSession() {
      const session = localStorage.getItem(STORAGE_KEYS.session);
      const expires = Number(
        localStorage.getItem(STORAGE_KEYS.sessionExpires)
      );

      if (!session || !expires) {
        return null;
      }

      if (Date.now() >= expires) {
        localStorage.removeItem(STORAGE_KEYS.session);
        localStorage.removeItem(STORAGE_KEYS.sessionExpires);
        localStorage.removeItem(STORAGE_KEYS.chatToken);

        return null;
      }

      return session;
    }

    function saveSession(session) {
      localStorage.setItem(STORAGE_KEYS.session, session);

      localStorage.setItem(
        STORAGE_KEYS.sessionExpires,
        String(Date.now() + SESSION_LIFETIME)
      );
    }

    /*
     * -------------------------
     * Session
     * -------------------------
     */

    async function getSession() {
      const existingSession = getStoredSession();

      if (existingSession) {
        return existingSession;
      }

      const response = await fetch(API.getSession, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        }
      });

      if (!response.ok) {
        throw new Error(
          `Не удалось получить сессию: HTTP ${response.status}`
        );
      }

      const data = await response.json();

      if (!data.session) {
        throw new Error("Сервер не вернул session");
      }

      saveSession(data.session);

      return data.session;
    }

    /*
     * -------------------------
     * Chat
     * -------------------------
     */

    async function getChat(session) {
      const response = await fetch(API.getChat, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          session
        })
      });

      if (!response.ok) {
        throw new Error(
          `Не удалось получить чат: HTTP ${response.status}`
        );
      }

      const data = await response.json();

      if (!data.chatToken) {
        throw new Error("Сервер не вернул chatToken");
      }

      currentChatToken = data.chatToken;

      localStorage.setItem(
        STORAGE_KEYS.chatToken,
        data.chatToken
      );

      renderChatHistory(data.chatHistory || []);

      return data;
    }

    /*
     * -------------------------
     * requestOnce
     * -------------------------
     */

    async function requestOnce(userRequest) {
      if (!currentSession) {
        throw new Error("Нет активной сессии");
      }

      if (!currentChatToken) {
        await getChat(currentSession);
      }

      const response = await fetch(API.requestOnce, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          session: currentSession,
          chatId: currentChatToken,
          aiRequest: userRequest
        })
      });

      if (!response.ok) {
        throw new Error(
          `Ошибка запроса: HTTP ${response.status}`
        );
      }

      const data = await response.json();

      if (data.chatToken) {
        currentChatToken = data.chatToken;

        localStorage.setItem(
          STORAGE_KEYS.chatToken,
          data.chatToken
        );
      }

      if (!data.success && !data.message) {
        throw new Error(
          data.error || "Сервер не вернул ответ"
        );
      }

      return data;
    }

    /*
     * -------------------------
     * Reset chat
     * -------------------------
     */

    async function resetChat() {
      if (!currentSession || !currentChatToken || isSending) {
        return;
      }

      const confirmed = window.confirm(
        "Сбросить историю этого чата?"
      );

      if (!confirmed) {
        return;
      }

      try {
        resetChatButton.disabled = true;

        const response = await fetch(API.resetChat, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            session: currentSession,
            chatId: currentChatToken
          })
        });

        if (!response.ok) {
          throw new Error(
            `Не удалось сбросить чат: HTTP ${response.status}`
          );
        }

        const data = await response.json();

        /*
         * По условию resetChat не меняет chatId.
         * Если сервер всё же вернул chatToken,
         * используем его.
         */

        if (data.chatToken) {
          currentChatToken = data.chatToken;

          localStorage.setItem(
            STORAGE_KEYS.chatToken,
            data.chatToken
          );
        }

        renderChatHistory([]);

        hideError();

        welcome.classList.remove("hidden");

        prompt.focus();

      } catch (error) {
        showError(error.message);
      } finally {
        resetChatButton.disabled = false;
      }
    }

    /*
     * -------------------------
     * Markdown renderer
     * -------------------------
     */

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value)
        .replace(/`/g, "&#096;");
    }

    function renderInlineMarkdown(text) {
      let result = escapeHtml(text);

      /*
       * Inline code
       */

      result = result.replace(
        /`([^`]+)`/g,
        '<code class="inline-code">$1</code>'
      );

      /*
       * Bold
       */

      result = result.replace(
        /\*\*(.+?)\*\*/g,
        "<strong>$1</strong>"
      );

      /*
       * Italic
       */

      result = result.replace(
        /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
        "<em>$1</em>"
      );

      /*
       * Links
       */

      result = result.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
      );

      /*
       * Plain URLs
       */

      result = result.replace(
        /(^|\s)(https?:\/\/[^\s<]+)/g,
        '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>'
      );

      return result;
    }

    function renderCodeBlock(code, language = "") {
      const encodedCode = encodeURIComponent(code);

      return `
        <div class="code-block">
          <div class="code-header">
            <button
              class="copy-code"
              type="button"
              data-code="${escapeAttribute(encodedCode)}"
            >
              Копировать
            </button>
          </div>

          <pre class="code-content"><code>${escapeHtml(code)}</code></pre>
        </div>
      `;
    }

    function renderMarkdown(markdown) {
      if (!markdown) {
        return "";
      }

      let source = String(markdown)
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");

      const codeBlocks = [];

      /*
       * Сначала извлекаем fenced code blocks:
       *
       * ```python
       * print("Hello")
       * ```
       */

      source = source.replace(
        /```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g,
        function (_, language, code) {
          const index = codeBlocks.length;

          codeBlocks.push(
            renderCodeBlock(
              code.replace(/\n$/,
              ""),
              language
            )
          );

          return `@@CODE_BLOCK_${index}@@`;
        }
      );

      const lines = source.split("\n");

      let html = "";
      let paragraph = [];
      let listType = null;

      function flushParagraph() {
        if (!paragraph.length) {
          return;
        }

        const content = paragraph.join("<br>");
        html += `<p>${content}</p>`;

        paragraph = [];
      }

      function closeList() {
        if (!listType) {
          return;
        }

        html += `</${listType}>`;
        listType = null;
      }

      for (const rawLine of lines) {
        const line = rawLine.trimEnd();

        /*
         * Empty line
         */

        if (!line.trim()) {
          flushParagraph();
          closeList();
          continue;
        }

        /*
         * Code block placeholder
         */

        const codeMatch = line.match(
          /^@@CODE_BLOCK_(\d+)@@$/
        );

        if (codeMatch) {
          flushParagraph();
          closeList();

          html += codeBlocks[
            Number(codeMatch[1])
          ];

          continue;
        }

        /*
         * Headings
         */

        const heading = line.match(
          /^(#{1,3})\s+(.+)$/
        );

        if (heading) {
          flushParagraph();
          closeList();

          const level = heading[1].length;

          html += `
            <h${level}>
              ${renderInlineMarkdown(heading[2])}
            </h${level}>
          `;

          continue;
        }

        /*
         * Unordered list
         */

        const unordered = line.match(
          /^\s*[-*]\s+(.+)$/
        );

        if (unordered) {
          flushParagraph();

          if (listType !== "ul") {
            closeList();
            html += "<ul>";
            listType = "ul";
          }

          html += `
            <li>${renderInlineMarkdown(unordered[1])}</li>
          `;

          continue;
        }

        /*
         * Ordered list
         */

        const ordered = line.match(
          /^\s*\d+\.\s+(.+)$/
        );

        if (ordered) {
          flushParagraph();

          if (listType !== "ol") {
            closeList();
            html += "<ol>";
            listType = "ol";
          }

          html += `
            <li>${renderInlineMarkdown(ordered[1])}</li>
          `;

          continue;
        }

        /*
         * Normal text
         */

        if (listType) {
          closeList();
        }

        paragraph.push(
          renderInlineMarkdown(line)
        );
      }

      flushParagraph();
      closeList();

      /*
       * На случай placeholder внутри текста.
       */

      html = html.replace(
        /@@CODE_BLOCK_(\d+)@@/g,
        function (_, index) {
          return codeBlocks[Number(index)] || "";
        }
      );

      return html;
    }

    /*
     * -------------------------
     * Render history
     * -------------------------
     */

    function renderChatHistory(history) {
      chatHistory.innerHTML = "";

      if (!Array.isArray(history) || history.length === 0) {
        welcome.classList.remove("hidden");
        return;
      }

      welcome.classList.add("hidden");

      for (const message of history) {
        const role =
          message.role === "user"
            ? "user"
            : "assistant";

        const messageElement =
          document.createElement("div");

        messageElement.className =
          `chat-message ${role}`;

        const bubble =
          document.createElement("div");

        bubble.className = "chat-bubble";

        if (role === "assistant") {
          bubble.classList.add("markdown");
          bubble.innerHTML = renderMarkdown(
            message.content || ""
          );
        } else {
          bubble.textContent =
            message.content || "";
        }

        messageElement.appendChild(bubble);
        chatHistory.appendChild(messageElement);
      }

      requestAnimationFrame(() => {
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth"
        });
      });
    }

    /*
     * -------------------------
     * Copy code
     * -------------------------
     */

    document.addEventListener("click", async (event) => {
      const button =
        event.target.closest(".copy-code");

      if (!button) {
        return;
      }

      const encodedCode =
        button.dataset.code || "";

      const code = decodeURIComponent(
        encodedCode
      );

      try {
        await navigator.clipboard.writeText(code);

        const oldText = button.textContent;

        button.textContent = "Скопировано";

        setTimeout(() => {
          button.textContent = oldText;
        }, 1200);

      } catch {
        button.textContent = "Ошибка";

        setTimeout(() => {
          button.textContent = "Копировать";
        }, 1200);
      }
    });

    /*
     * -------------------------
     * UI helpers
     * -------------------------
     */

    function showError(message) {
      errorMessage.textContent =
        message || "Произошла ошибка";

      errorMessage.classList.add("visible");
    }

    function hideError() {
      errorMessage.classList.remove("visible");
      errorMessage.textContent = "";
    }

    function setLoading(value) {
      isSending = value;

      loading.classList.toggle(
        "visible",
        value
      );

      sendButton.disabled = value;
      resetChatButton.disabled = value;
    }

    /*
     * -------------------------
     * Send message
     * -------------------------
     */

    async function sendMessage() {
      const text = prompt.value.trim();

      if (!text || isSending) {
        return;
      }

      hideError();

      /*
       * Убираем welcome
       */

      welcome.classList.add("hidden");

      /*
       * Сразу показываем сообщение пользователя.
       * После ответа история будет синхронизирована
       * с сервером через getChat().
       */

      const userMessage =
        document.createElement("div");

      userMessage.className =
        "chat-message user";

      const userBubble =
        document.createElement("div");

      userBubble.className =
        "chat-bubble";

      userBubble.textContent = text;

      userMessage.appendChild(userBubble);
      chatHistory.appendChild(userMessage);

      prompt.value = "";
      resizeTextarea();

      requestAnimationFrame(() => {
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth"
        });
      });

      setLoading(true);

      try {
        /*
         * На случай истёкшей сессии:
         * убеждаемся, что session + chat относятся
         * друг к другу.
         */

        const session = await getSession();

        if (
          !currentSession ||
          currentSession !== session
        ) {
          currentSession = session;

          /*
           * Получаем chat заново для новой сессии.
           * Старый chatToken к новой сессии не относится.
           */

          currentChatToken = null;

          await getChat(currentSession);
        }

        if (!currentChatToken) {
          await getChat(currentSession);
        }

        await requestOnce(text);

        /*
         * Получаем актуальную серверную историю.
         */

        await getChat(currentSession);

      } catch (error) {
        console.error(error);

        showError(
          error.message ||
          "Не удалось получить ответ"
        );

      } finally {
        setLoading(false);
        prompt.focus();
      }
    }

    /*
     * -------------------------
     * Textarea auto resize
     * -------------------------
     */

    function resizeTextarea() {
      prompt.style.height = "auto";

      const height = Math.min(
        prompt.scrollHeight,
        180
      );

      prompt.style.height =
        `${Math.max(height, 38)}px`;
    }

    prompt.addEventListener(
      "input",
      resizeTextarea
    );

    /*
     * Enter = send
     * Shift + Enter = new line
     */

    prompt.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();

          if (!isSending) {
            composer.requestSubmit();
          }
        }
      }
    );

    composer.addEventListener(
      "submit",
      (event) => {
        event.preventDefault();
        sendMessage();
      }
    );

    resetChatButton.addEventListener(
      "click",
      resetChat
    );

    /*
     * -------------------------
     * Initialization
     * -------------------------
     */

    async function initialize() {
      try {
        currentSession = await getSession();

        /*
         * Всегда получаем chat через API.
         * Сервер вернёт существующий chatToken
         * и всю историю.
         */

        await getChat(currentSession);

      } catch (error) {
        console.error(error);

        showError(
          error.message ||
          "Не удалось подключиться к серверу"
        );
      }
    }

    initialize();
    prompt.focus();
  </script>


</body></html>
