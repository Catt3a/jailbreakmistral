<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>eval</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --text: #171717;
      --muted: #8a8a8a;
      --border: #e5e5e5;
      --input: #f7f7f7;
      --code-bg: #f4f4f4;
      --button: #171717;
      --button-text: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181818;
        --text: #f5f5f5;
        --muted: #929292;
        --border: #303030;
        --input: #222222;
        --code-bg: #111111;
        --button: #f5f5f5;
        --button-text: #171717;
      }
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* -------------------------
       Header
    ------------------------- */

    header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      object-fit: cover;
    }

    /* -------------------------
       Main
    ------------------------- */

    main {
      flex: 1;

      width: 100%;
      max-width: 820px;

      margin: 0 auto;

      padding: 20px;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* -------------------------
       Welcome
    ------------------------- */

    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      margin-bottom: 28px;
    }

    .welcome-icon {
      width: 52px;
      height: 52px;

      margin-bottom: 14px;

      border-radius: 15px;

      object-fit: cover;

      box-shadow:
        0 2px 12px rgba(0, 0, 0, .06);
    }

    .welcome h1 {
      margin: 0 0 8px;

      font-size: clamp(28px, 5vw, 38px);
      line-height: 1.2;

      font-weight: 600;
      letter-spacing: -1.2px;
    }

    .welcome p {
      margin: 0;

      color: var(--muted);
      font-size: 15px;
    }

    /* -------------------------
       Answer
    ------------------------- */

    .answer {
      display: none;

      margin-bottom: 24px;
      padding: 0 8px;

      font-size: 16px;
      line-height: 1.65;

      overflow-wrap: anywhere;

      animation: fadeIn .25s ease;
    }

    .answer.visible {
      display: block;
    }

    .answer.error {
      color: #d44;
    }

    .answer p {
      margin: 0 0 14px;
    }

    .answer p:last-child {
      margin-bottom: 0;
    }

    .answer strong {
      font-weight: 700;
    }

    .answer em {
      font-style: italic;
    }

    .answer h1,
    .answer h2,
    .answer h3 {
      line-height: 1.3;
      margin: 22px 0 10px;
    }

    .answer h1 {
      font-size: 25px;
    }

    .answer h2 {
      font-size: 21px;
    }

    .answer h3 {
      font-size: 18px;
    }

    .answer ul,
    .answer ol {
      padding-left: 24px;
      margin: 8px 0 16px;
    }

    .answer li {
      margin: 4px 0;
    }

    .answer a {
      color: inherit;
    }

    .answer code:not(.code-content) {
      padding: 2px 6px;

      border-radius: 5px;

      background: var(--code-bg);

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: .9em;
    }

    /* -------------------------
       Code
    ------------------------- */

    .code-block {
      position: relative;

      margin: 16px 0;

      border: 1px solid var(--border);
      border-radius: 12px;

      overflow: hidden;

      background: var(--code-bg);
    }

    .code-header {
      height: 38px;

      padding: 0 10px 0 14px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--border);

      color: var(--muted);
      font-size: 12px;
    }

    .copy-button {
      border: 0;
      background: transparent;

      color: var(--muted);

      cursor: pointer;

      padding: 5px 8px;

      border-radius: 6px;

      font-size: 12px;
    }

    .copy-button:hover {
      background: rgba(128, 128, 128, .12);
      color: var(--text);
    }

    .code-content {
      display: block;

      padding: 14px;

      overflow-x: auto;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 13px;
      line-height: 1.6;

      white-space: pre;
    }

    /* -------------------------
       Composer
    ------------------------- */

    .composer {
      width: 100%;

      background: var(--input);

      border: 1px solid var(--border);
      border-radius: 18px;

      padding: 12px;

      transition:
        border-color .2s,
        box-shadow .2s;
    }

    .composer:focus-within {
      border-color: #c8c8c8;

      box-shadow:
        0 2px 15px rgba(0, 0, 0, .04);
    }

    textarea {
      display: block;

      width: 100%;

      min-height: 58px;
      max-height: 200px;

      resize: none;

      border: 0;
      outline: 0;

      background: transparent;

      color: var(--text);

      font: inherit;
      font-size: 15px;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .composer-bottom {
      display: flex;
      justify-content: flex-end;

      margin-top: 6px;
    }

    #send {
      width: 36px;
      height: 36px;

      border: 0;
      border-radius: 50%;

      background: var(--button);
      color: var(--button-text);

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      transition:
        transform .15s,
        opacity .15s;
    }

    #send:hover:not(:disabled) {
      transform: scale(1.04);
    }

    #send:active:not(:disabled) {
      transform: scale(.95);
    }

    #send:disabled {
      opacity: .35;
      cursor: default;
    }

    #send svg {
      width: 18px;
      height: 18px;

      stroke: currentColor;
      stroke-width: 2;

      fill: none;
    }

    /* -------------------------
       Loading
    ------------------------- */

    .loading {
      display: none;

      justify-content: center;

      margin-top: 18px;
    }

    .loading.visible {
      display: flex;
    }

    .dots {
      display: flex;
      gap: 5px;
    }

    .dots span {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--muted);

      animation:
        bounce 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) {
      animation-delay: .15s;
    }

    .dots span:nth-child(3) {
      animation-delay: .3s;
    }

    /* -------------------------
       Footer
    ------------------------- */

    footer {
      text-align: center;

      color: var(--muted);

      font-size: 11px;

      padding: 0 20px 18px;
    }

    /* -------------------------
       Animations
    ------------------------- */

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-4px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      header {
        height: 56px;
        padding: 0 16px;
      }

      main {
        padding: 14px;
      }

      .composer {
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">

      <img
        src="https://raw.githubusercontent.com/Catt3a/jailbreakmistral/refs/heads/main/icon.png"
        alt="eval"
      >

      <span>eval</span>

    </div>
  </header>


  <main>

    <!-- Начальный экран -->

    <div class="welcome" id="welcome">

      <img
        class="welcome-icon"
        src="https://raw.githubusercontent.com/Catt3a/jailbreakmistral/refs/heads/main/icon.png"
        alt="eval"
      >

      <h1>Чем могу помочь?</h1>

      <p>Задайте любой вопрос</p>

    </div>


    <!-- Текущий ответ -->

    <div
      id="answer"
      class="answer"
    ></div>


    <!-- Поле ввода -->

    <form
      id="form"
      class="composer"
    >

      <textarea
        id="input"
        placeholder="Сообщение для eval..."
        autocomplete="off"
        rows="1"
      ></textarea>


      <div class="composer-bottom">

        <button
          id="send"
          type="submit"
          disabled
          aria-label="Отправить"
        >

          <svg viewBox="0 0 24 24">
            <path d="M12 19V5"></path>
            <path d="M6 11l6-6 6 6"></path>
          </svg>

        </button>

      </div>

    </form>


    <!-- Индикатор загрузки -->

    <div
      id="loading"
      class="loading"
    >

      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

  </main>


  <footer>
    eval может допускать ошибки. Проверяйте важную информацию.
  </footer>

</div>


<script>

/* =========================================================
   API
========================================================= */

const API_BASE =
  "https://evalai-k8a4.onrender.com";

const API = {
  getSession:
    `${API_BASE}/v1/getSession`,

  getChat:
    `${API_BASE}/v1/getChat`,

  requestOnce:
    `${API_BASE}/v1/requestOnce`,

  resetChat:
    `${API_BASE}/v1/resetChat`
};


/* =========================================================
   Local storage
========================================================= */

const STORAGE_KEYS = {
  session: "eval_session",
  sessionExpires: "eval_session_expires",
  chatToken: "eval_chat_token"
};


/*
 * Сессия живёт ровно 2 дня.
 */

const SESSION_LIFETIME =
  2 * 24 * 60 * 60 * 1000;


/* =========================================================
   DOM
========================================================= */

const form =
  document.getElementById("form");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const answer =
  document.getElementById("answer");

const loading =
  document.getElementById("loading");

const welcome =
  document.getElementById("welcome");


/* =========================================================
   Storage helpers
========================================================= */

function getStoredSession() {

  const session =
    localStorage.getItem(
      STORAGE_KEYS.session
    );

  const expires =
    Number(
      localStorage.getItem(
        STORAGE_KEYS.sessionExpires
      )
    );

  if (
    !session ||
    !expires ||
    Date.now() >= expires
  ) {

    localStorage.removeItem(
      STORAGE_KEYS.session
    );

    localStorage.removeItem(
      STORAGE_KEYS.sessionExpires
    );

    return null;
  }

  return session;
}


function saveSession(session) {

  localStorage.setItem(
    STORAGE_KEYS.session,
    session
  );

  localStorage.setItem(
    STORAGE_KEYS.sessionExpires,
    String(
      Date.now() + SESSION_LIFETIME
    )
  );
}


function getChatToken() {

  return localStorage.getItem(
    STORAGE_KEYS.chatToken
  );
}


function saveChatToken(chatToken) {

  if (!chatToken) return;

  localStorage.setItem(
    STORAGE_KEYS.chatToken,
    chatToken
  );
}


/* =========================================================
   Session
========================================================= */

async function getSession() {

  const existingSession =
    getStoredSession();

  if (existingSession) {
    return existingSession;
  }

  /*
   * getSession — POST запрос.
   * Session сюда не передаём,
   * поскольку именно этот endpoint её выдаёт.
   */

  const response =
    await fetch(API.getSession, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      }
    });

  if (!response.ok) {
    throw new Error(
      `Не удалось получить сессию: HTTP ${response.status}`
    );
  }

  const data =
    await response.json();

  if (!data.session) {
    throw new Error(
      "Сервер не вернул session"
    );
  }

  saveSession(data.session);

  return data.session;
}


/* =========================================================
   Get chat
========================================================= */

async function getChat(session) {

  /*
   * getChat получает session.
   *
   * Если чата нет — сервер сам его создаёт.
   */

  const response =
    await fetch(API.getChat, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        session: session
      })
    });


  if (!response.ok) {

    throw new Error(
      `Не удалось получить чат: HTTP ${response.status}`
    );
  }


  const data =
    await response.json();


  /*
   * Сервер возвращает:
   *
   * {
   *   chatHistory: [...],
   *   chatToken: "..."
   * }
   */


  if (data.chatToken) {

    saveChatToken(
      data.chatToken
    );
  }


  return data;
}


/* =========================================================
   Initialize
========================================================= */

let currentSession = null;
let currentChatToken = null;


/*
 * При открытии сайта:
 *
 * 1. Получаем session.
 * 2. Получаем/создаём chat.
 * 3. Сохраняем chatToken.
 *
 * chatHistory намеренно НЕ отображается.
 */

async function initialize() {

  try {

    currentSession =
      await getSession();


    currentChatToken =
      getChatToken();


    /*
     * Даже если chatToken уже есть,
     * проверяем его через сервер.
     *
     * Это также позволяет серверу
     * создать чат, если его ещё нет.
     */

    const chat =
      await getChat(
        currentSession
      );


    if (chat.chatToken) {

      currentChatToken =
        chat.chatToken;

      saveChatToken(
        currentChatToken
      );
    }


    console.log(
      "eval initialized"
    );

  } catch (error) {

    console.error(
      "Initialization error:",
      error
    );

    showError(
      "Не удалось подключиться к серверу."
    );
  }
}


/* =========================================================
   Markdown
========================================================= */

function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function renderInline(text) {

  text = escapeHTML(text);


  /*
   * Inline code
   */

  text = text.replace(
    /`([^`\n]+)`/g,
    "<code>$1</code>"
  );


  /*
   * Bold
   */

  text = text.replace(
    /\*\*(.+?)\*\*/g,
    "<strong>$1</strong>"
  );


  /*
   * Italic
   */

  text = text.replace(
    /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
    "<em>$1</em>"
  );


  /*
   * Links
   */

  text = text.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,

    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
  );


  return text;
}


function renderMarkdown(markdown) {

  const codeBlocks = [];


  /*
   * Сначала извлекаем fenced code blocks.
   */

  let text =
    markdown.replace(
      /```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g,

      (match, language, code) => {

        const id =
          codeBlocks.length;


        codeBlocks.push({
          language:
            language || "code",

          code:
            code.replace(/\n$/, "")
        });


        return `@@CODE_BLOCK_${id}@@`;
      }
    );


  const lines =
    text.split("\n");


  let html = "";

  let inList = false;
  let listType = null;


  function closeList() {

    if (inList) {

      html +=
        `</${listType}>`;

      inList = false;
      listType = null;
    }
  }


  for (const line of lines) {

    const trimmed =
      line.trim();


    if (!trimmed) {

      closeList();

      continue;
    }


    /*
     * Заголовки
     */

    const heading =
      trimmed.match(
        /^(#{1,3})\s+(.+)$/
      );


    if (heading) {

      closeList();

      const level =
        heading[1].length;


      html +=
        `<h${level}>${renderInline(heading[2])}</h${level}>`;

      continue;
    }


    /*
     * Маркированный список
     */

    const bullet =
      trimmed.match(
        /^[-*]\s+(.+)$/
      );


    if (bullet) {

      if (
        !inList ||
        listType !== "ul"
      ) {

        closeList();

        html += "<ul>";

        inList = true;
        listType = "ul";
      }


      html +=
        `<li>${renderInline(bullet[1])}</li>`;

      continue;
    }


    /*
     * Нумерованный список
     */

    const numbered =
      trimmed.match(
        /^\d+\.\s+(.+)$/
      );


    if (numbered) {

      if (
        !inList ||
        listType !== "ol"
      ) {

        closeList();

        html += "<ol>";

        inList = true;
        listType = "ol";
      }


      html +=
        `<li>${renderInline(numbered[1])}</li>`;

      continue;
    }


    /*
     * Обычный текст
     */

    closeList();


    if (
      trimmed.includes(
        "@@CODE_BLOCK_"
      )
    ) {

      html +=
        renderInline(trimmed);

    } else {

      html +=
        `<p>${renderInline(trimmed)}</p>`;
    }
  }


  closeList();


  /*
   * Возвращаем code blocks.
   */

  html =
    html.replace(
      /@@CODE_BLOCK_(\d+)@@/g,

      (match, index) => {

        const block =
          codeBlocks[
            Number(index)
          ];


        const encodedCode =
          encodeURIComponent(
            block.code
          );


        return `
          <div class="code-block">

            <div class="code-header">

              <span>
                ${escapeHTML(block.language)}
              </span>

              <button
                class="copy-button"
                type="button"
                data-code="${encodedCode}"
                onclick="copyCode(this)"
              >
                Копировать
              </button>

            </div>

            <code class="code-content">${escapeHTML(block.code)}</code>

          </div>
        `;
      }
    );


  return html;
}


/* =========================================================
   Copy code
========================================================= */

async function copyCode(button) {

  const code =
    decodeURIComponent(
      button.dataset.code
    );


  try {

    await navigator.clipboard.writeText(
      code
    );


    const oldText =
      button.textContent;


    button.textContent =
      "Скопировано!";


    setTimeout(() => {

      button.textContent =
        oldText;

    }, 1500);


  } catch {

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value = code;

    textarea.style.position =
      "fixed";

    textarea.style.opacity =
      "0";


    document.body.appendChild(
      textarea
    );


    textarea.select();

    document.execCommand(
      "copy"
    );


    textarea.remove();


    button.textContent =
      "Скопировано!";


    setTimeout(() => {

      button.textContent =
        "Копировать";

    }, 1500);
  }
}


/* =========================================================
   Error
========================================================= */

function showError(message) {

  answer.textContent =
    message;

  answer.classList.add(
    "visible",
    "error"
  );
}


/* =========================================================
   Input
========================================================= */

input.addEventListener(
  "input",
  () => {

    send.disabled =
      !input.value.trim();


    input.style.height =
      "auto";


    input.style.height =
      Math.min(
        input.scrollHeight,
        200
      ) + "px";
  }
);


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();


      if (!send.disabled) {

        form.requestSubmit();
      }
    }
  }
);


/* =========================================================
   Request once
========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const userRequest =
      input.value.trim();


    if (!userRequest) {
      return;
    }


    answer.classList.remove(
      "visible",
      "error"
    );

    answer.innerHTML = "";


    welcome.style.display =
      "none";


    loading.classList.add(
      "visible"
    );


    input.disabled =
      true;

    send.disabled =
      true;


    try {

      /*
       * На всякий случай убеждаемся,
       * что сессия ещё действительна.
       */

      currentSession =
        await getSession();


      /*
       * Если chatToken отсутствует,
       * получаем/создаём чат.
       */

      if (!currentChatToken) {

        const chat =
          await getChat(
            currentSession
          );


        currentChatToken =
          chat.chatToken;


        saveChatToken(
          currentChatToken
        );
      }


      /*
       * requestOnce:
       *
       * {
       *   session,
       *   chatId,
       *   aiRequest
       * }
       */

      const response =
        await fetch(
          API.requestOnce,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              session:
                currentSession,

              chatId:
                currentChatToken,

              aiRequest:
                userRequest
            })
          }
        );


      if (!response.ok) {

        throw new Error(
          `HTTP ${response.status}`
        );
      }


      const data =
        await response.json();


      /*
       * Сервер может вернуть новый
       * chatToken.
       *
       * Если вернул — сохраняем его.
       */

      if (data.chatToken) {

        currentChatToken =
          data.chatToken;


        saveChatToken(
          currentChatToken
        );
      }


      if (
        data.success === false
      ) {

        throw new Error(
          data.message ||
          "API error"
        );
      }


      const message =
        data.message ?? "";


      answer.innerHTML =
        renderMarkdown(
          String(message)
        );


      answer.classList.add(
        "visible"
      );


    } catch (error) {

      console.error(
        "Request error:",
        error
      );


      showError(
        "Не удалось получить ответ. Проверьте подключение к API."
      );


    } finally {

      loading.classList.remove(
        "visible"
      );


      input.disabled =
        false;


      input.value =
        "";


      input.style.height =
        "auto";


      send.disabled =
        true;


      input.focus();
    }

  }
);


/* =========================================================
   Start
========================================================= */

initialize();

</script>

</body>
</html>
