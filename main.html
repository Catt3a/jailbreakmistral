<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eval</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --text: #171717;
      --muted: #8b8b8b;
      --border: #e5e5e5;
      --input: #f7f7f7;
      --button: #171717;
      --button-hover: #303030;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181818;
        --text: #f5f5f5;
        --muted: #929292;
        --border: #303030;
        --input: #222222;
        --button: #f5f5f5;
        --button-hover: #dcdcdc;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      object-fit: cover;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 20px 30px;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .welcome {
      text-align: center;
      margin-bottom: 28px;
      animation: fadeIn .35s ease;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 38px);
      font-weight: 600;
      letter-spacing: -1.2px;
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .answer {
      display: none;
      margin-bottom: 24px;
      padding: 4px 8px;
      line-height: 1.65;
      font-size: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      animation: fadeIn .25s ease;
    }

    .answer.visible {
      display: block;
    }

    .answer.error {
      color: #d44;
    }

    .composer {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;

      transition:
        border-color .2s,
        box-shadow .2s;
    }

    .composer:focus-within {
      border-color: #c8c8c8;
      box-shadow: 0 2px 15px rgba(0, 0, 0, .04);
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 58px;
      max-height: 200px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);

      font: inherit;
      font-size: 15px;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .composer-bottom {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 6px;
    }

    button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: var(--button);
      color: var(--bg);

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      transition:
        transform .15s,
        background .15s,
        opacity .15s;
    }

    button:hover:not(:disabled) {
      background: var(--button-hover);
      transform: scale(1.04);
    }

    button:active:not(:disabled) {
      transform: scale(.95);
    }

    button:disabled {
      cursor: default;
      opacity: .35;
    }

    button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .loading {
      display: none;
      justify-content: center;
      margin-top: 18px;
    }

    .loading.visible {
      display: flex;
    }

    .dots {
      display: flex;
      gap: 5px;
    }

    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) {
      animation-delay: .15s;
    }

    .dots span:nth-child(3) {
      animation-delay: .3s;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 0 20px 18px;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-4px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      header {
        height: 56px;
        padding: 0 16px;
      }

      main {
        padding: 0 14px 24px;
      }

      .welcome {
        margin-bottom: 22px;
      }

      .composer {
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header>
      <div class="brand">
        <img
          src="https://raw.githubusercontent.com/Catt3a/jailbreakmistral/refs/heads/main/icon.png"
          alt="eval"
        />
        <span>eval</span>
      </div>
    </header>

    <main>
      <div class="welcome">
        <h1>Чем могу помочь?</h1>
        <p>Задайте любой вопрос</p>
      </div>

      <div id="answer" class="answer"></div>

      <form id="form" class="composer">
        <textarea
          id="input"
          placeholder="Сообщение для eval..."
          autocomplete="off"
          rows="1"
        ></textarea>

        <div class="composer-bottom">
          <button id="send" type="submit" disabled aria-label="Отправить">
            <svg viewBox="0 0 24 24">
              <path d="M12 19V5"></path>
              <path d="M6 11l6-6 6 6"></path>
            </svg>
          </button>
        </div>
      </form>

      <div id="loading" class="loading">
        <div class="dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </main>

    <footer>
      eval может допускать ошибки. Проверяйте важную информацию.
    </footer>

  </div>

  <script>
    const API_URL = "https://evalai-k8a4.onrender.com/v1/requestOnce";

    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const answer = document.getElementById("answer");
    const loading = document.getElementById("loading");
    const welcome = document.querySelector(".welcome");

    // Активируем кнопку, когда есть текст
    input.addEventListener("input", () => {
      send.disabled = !input.value.trim();

      // Автоматически увеличиваем textarea
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 200) + "px";
    });

    // Enter отправляет, Shift+Enter переносит строку
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();

        if (!send.disabled) {
          form.requestSubmit();
        }
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const userRequest = input.value.trim();

      if (!userRequest) return;

      // Показываем только текущий ответ.
      // История сообщений нигде не сохраняется.
      answer.classList.remove("visible", "error");
      answer.textContent = "";

      welcome.style.display = "none";
      loading.classList.add("visible");

      input.disabled = true;
      send.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            aiRequest: userRequest
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        /*
         * Ожидаем JSON от API.
         *
         * Поддерживаются несколько распространённых вариантов:
         * { "response": "..." }
         * { "answer": "..." }
         * { "result": "..." }
         * { "text": "..." }
         *
         * Если API возвращает просто строку — она тоже будет показана.
         */
        const contentType = response.headers.get("content-type") || "";

        let result;

        if (contentType.includes("application/json")) {
          result = await response.json();

          if (typeof result === "string") {
            result = result;
          } else {
            result =
              result.response ??
              result.answer ??
              result.result ??
              result.text ??
              JSON.stringify(result, null, 2);
          }
        } else {
          result = await response.text();
        }

        answer.textContent = result || "Модель не вернула ответ.";
        answer.classList.add("visible");

      } catch (error) {
        console.error(error);

        answer.textContent =
          "Не удалось получить ответ. Проверьте подключение к API.";
        answer.classList.add("visible", "error");

      } finally {
        loading.classList.remove("visible");

        input.disabled = false;
        input.value = "";
        input.style.height = "auto";
        send.disabled = true;

        input.focus();
      }
    });
  </script>
</body>
</html>
